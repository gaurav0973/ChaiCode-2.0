<!doctype html>
<html>
  <head>
    <title>Login with Google</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-1: #060913;
        --bg-2: #111827;
        --surface: rgba(17, 24, 39, 0.75);
        --surface-border: rgba(148, 163, 184, 0.2);
        --text-main: #f8fafc;
        --text-muted: #93a3b8;
        --accent: #38bdf8;
        --accent-2: #a78bfa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background:
          radial-gradient(
            circle at 20% 0%,
            rgba(56, 189, 248, 0.25),
            transparent 34%
          ),
          radial-gradient(
            circle at 100% 100%,
            rgba(167, 139, 250, 0.25),
            transparent 38%
          ),
          linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
        color: var(--text-main);
      }

      .card {
        width: min(94vw, 760px);
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 28px;
        padding: 28px;
        border: 1px solid var(--surface-border);
        border-radius: 26px;
        background: var(--surface);
        backdrop-filter: blur(14px);
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      h2 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.35rem);
        letter-spacing: -0.03em;
        color: var(--text-main);
      }

      .brand {
        display: grid;
        place-items: center;
        align-content: center;
        gap: 14px;
      }

      .mark {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 3.2rem;
        font-weight: 700;
        color: #ffffff;
        background: radial-gradient(
          circle at 35% 30%,
          #60a5fa 0%,
          #3b82f6 55%,
          #2563eb 100%
        );
        border: 4px solid rgba(56, 189, 248, 0.42);
        box-shadow: 0 16px 34px rgba(2, 132, 199, 0.28);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 13px;
        border-radius: 999px;
        background: rgba(30, 41, 59, 0.8);
        color: var(--text-muted);
        font-size: 0.88rem;
        border: 1px solid rgba(148, 163, 184, 0.22);
      }

      .status::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #38bdf8;
        box-shadow: 0 0 10px #38bdf8;
      }

      .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--text-muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .accent {
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .meta {
        margin-top: 24px;
        display: grid;
        gap: 10px;
      }

      .meta-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.18);
      }

      .label {
        min-width: 86px;
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      .value {
        color: var(--text-main);
      }

      a {
        text-decoration: none;
      }

      button {
        border: 0;
        border-radius: 999px;
        margin-top: 14px;
        padding: 0.9rem 1.45rem;
        font-size: 1rem;
        font-weight: 700;
        color: white;
        background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
        box-shadow: 0 14px 30px rgba(14, 165, 233, 0.28);
        cursor: pointer;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          filter 0.18s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 34px rgba(14, 165, 233, 0.34);
        filter: brightness(1.06);
      }

      button:active {
        transform: translateY(0);
      }

      @media (max-width: 700px) {
        .card {
          grid-template-columns: 1fr;
          text-align: center;
          gap: 18px;
          padding: 22px;
        }

        .content {
          align-items: center;
        }

        .meta {
          width: 100%;
        }

        .meta-item {
          justify-content: center;
          flex-wrap: wrap;
        }

        .label {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section class="brand">
        <div class="mark">G</div>
        <span class="status">Sign in required</span>
      </section>

      <section class="content">
        <h2>Welcome to <span class="accent">OIDC + OAuth2</span></h2>
        <p class="subtitle">
          Connect your Google account to continue with secure authentication.
        </p>

        <div class="meta">
          <div class="meta-item">
            <span class="label">Provider</span>
            <span class="value">Google OAuth 2.0</span>
          </div>
          <div class="meta-item">
            <span class="label">Flow</span>
            <span class="value">Authorization Code + OIDC</span>
          </div>
        </div>

        <a href="http://localhost:3000/auth/google">
          <button>Login with Google</button>
        </a>
      </section>
    </main>
  </body>
</html>
